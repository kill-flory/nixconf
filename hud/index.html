<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PC HUD</title>
<style>
:root{--bg:#070b14;--tx:#eef2ff;--mu:#7d88ad;--g:#3ee6a8;--c:#38bdf8;--o:#ff9a3c;--y:#ffc933;--r:#ff5d73;--amb:80,120,255;
--mono:"JetBrains Mono","SF Mono",ui-monospace,Consolas,monospace;--sans:"Inter","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.4 var(--sans);min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(110px);opacity:.45;transition:background 1s}
.bg i:nth-child(1){width:55vw;height:55vw;left:-15vw;top:-20vw;background:rgb(var(--amb))}
.bg i:nth-child(2){width:45vw;height:45vw;right:-10vw;bottom:-18vw;background:#ff9a3c33}
.bg::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#0000 0 3px,#0000000d 3px 4px)}
main{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:22px;padding:26px;max-width:1560px;margin:auto}
.case{grid-column:span 8}.side{grid-column:span 4}.cpu,.gpu{grid-column:span 6}
@media(max-width:1100px){.case,.side,.cpu,.gpu{grid-column:1/-1}main{padding:12px}}
.card{position:relative;padding:20px 22px;border-radius:22px;background:linear-gradient(160deg,#131a2fcc,#0a0f1dcc);
backdrop-filter:blur(14px);box-shadow:0 20px 60px #0009,inset 0 0 0 1px #ffffff12;--a:var(--g)}
.card::before{content:"";position:absolute;left:24px;right:24px;top:0;height:2px;border-radius:2px;background:linear-gradient(90deg,#0000,var(--a),#0000);box-shadow:0 0 22px var(--a)}
.cpu{--a:var(--c)}.gpu{--a:var(--o)}.side{--a:#b58cff}
h2{font:600 13px var(--mono);letter-spacing:.18em;color:var(--a);display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h2 small{color:var(--mu);letter-spacing:.05em;font-weight:400}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.big{font:700 clamp(32px,3.2vw,50px)/1 var(--mono);letter-spacing:-.03em}
.big u{text-decoration:none;font-size:.4em;color:var(--mu);margin-left:4px}
.lbl{font:500 11px var(--mono);color:var(--mu);letter-spacing:.12em;margin-bottom:4px}
svg text{font-family:var(--mono)}
.share{display:flex;height:6px;border-radius:6px;overflow:hidden;margin:14px 0 4px;background:#ffffff10}
.share i{display:block;height:100%;transition:width .6s}
.share i:first-child{background:var(--c);box-shadow:0 0 12px var(--c)}.share i:last-child{background:var(--o);box-shadow:0 0 12px var(--o)}
.chart{margin:12px 0 4px;height:120px}.chart svg{width:100%;height:100%;overflow:visible}
.tabs{display:flex;gap:6px;font:11px var(--mono);color:var(--mu);align-items:center}
.tabs b{margin-right:auto;font-weight:400}
.tabs button{all:unset;cursor:pointer;padding:2px 8px;border-radius:6px}
.tabs button.on{color:var(--a);box-shadow:inset 0 0 0 1px var(--a)}
.rows{margin-top:14px}
.row{display:grid;grid-template-columns:1fr auto;padding:8px 0 0}
.row span:first-child{color:#aeb7d6}.row span:last-child{font:600 15px var(--mono)}
.row em{font-style:normal;color:var(--mu);font-size:.8em;margin-left:3px}
.bar{grid-column:1/-1;height:3px;margin-top:7px;background:#ffffff10;border-radius:3px}
.bar i{display:block;height:100%;width:0;border-radius:3px;background:var(--a);box-shadow:0 0 10px var(--a);transition:width .5s,background .5s}
.case svg#board{width:100%;display:block;margin-top:10px}
.led{transition:fill .25s;filter:url(#glow)}
#rgbinfo{font:11px var(--mono);color:var(--mu);margin-top:8px;word-break:break-word}
.gt{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px;font:600 11px var(--mono);letter-spacing:.14em;color:var(--mu)}
.gt:first-of-type{margin-top:0}.gt b{font-size:22px;letter-spacing:0;transition:color .5s}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:9px}
.tile{--tc:#4a5378;padding:9px 11px 10px;border-radius:12px;background:color-mix(in srgb,var(--tc) 9%,#0c1122);
box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tc) 32%,transparent),0 0 18px color-mix(in srgb,var(--tc) 12%,transparent);transition:background .6s,box-shadow .6s}
.tr{display:flex;justify-content:space-between;align-items:center}
.ti{display:flex;gap:6px;align-items:center;color:var(--mu);font:11px var(--mono)}.ti small{max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile b{font:700 20px var(--mono);color:var(--tc);transition:color .6s}.tile em{font-style:normal;font-size:.55em;margin-left:2px;color:var(--mu)}
.tile .bar{margin-top:8px;height:3px}.tile .bar i{background:var(--tc);box-shadow:0 0 8px var(--tc)}
.note{font:11px var(--mono);color:var(--mu);margin-top:8px}
</style></head><body>
